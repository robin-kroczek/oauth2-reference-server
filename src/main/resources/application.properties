spring.application.name=oauth2-reference-server
management.server.port=8081
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.forward-headers-strategy=framework

# local default. Should be overwritten in app.env!
spring.security.oauth2.authorizationserver.issuer=https://auth.rkroczek.de

#Request handling is dominated by short blocking calls, so platform threads spend most of their time waiting.
# --> enable virtual threads
spring.threads.virtual.enabled=true

# PostgreSQL setup
# local default. Should be overwritten in app.env!
spring.datasource.url=jdbc:postgresql://localhost:5432/oauth2_reference_server
spring.datasource.username=oauth2_reference_server
spring.datasource.password=dev-only-not-a-secret

# PostgreSQL Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Baselines existing schema if no schema history table is found
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Bootstrap admin client. Leave blank to skip; set per environment.
bootstrap.admin-client.client-id=
bootstrap.admin-client.client-secret=