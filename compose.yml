name: oauth2-reference-server

services:
  oauth2-reference-server:
    image: ${APP_IMAGE:?APP_IMAGE nicht gesetzt}
    container_name: oauth2-reference-server
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    env_file:
      - path: app.env
        required: false

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

    stop_grace_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.5"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"