name: oauth2-reference-server

services:
  oauth2-reference-server:
    image: ${APP_IMAGE:?APP_IMAGE nicht gesetzt}
    container_name: oauth2-reference-server
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oauth2_reference_server
      SPRING_DATASOURCE_USERNAME: oauth2_reference_server
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD nicht gesetzt}
    env_file:
      - path: app.env
        required: false

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

    stop_grace_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.5"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oauth2_reference_server
      POSTGRES_USER: oauth2_reference_server
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD nicht gesetzt}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U oauth2_reference_server" ]
      interval: 5s
      retries: 10

volumes:
  pgdata: